<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Monitor</title>
    <!-- Picks the palette before the first paint. A file rather than an inline
         script, so it still runs behind a Content-Security-Policy that forbids
         inline code; and not a module, which would run only after the page had
         been painted once in the wrong colours. -->
    <script src="/boot.js" vite-ignore></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
